; Pool tuning with a ping endpoint for the healthcheck.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
ping.path = /ping
ping.response = pong
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
