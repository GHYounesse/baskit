# Production stack for Baskit on a single VPS behind the host's Nginx.
#
# Nothing here publishes port 80 or 443. The only published port is the web
# container on 127.0.0.1:8081, which the host's Nginx proxies to.
#
# Variables like ${IMAGE_TAG} and ${DB_PASSWORD} come from the .env next to this
# file (never committed). deploy.sh sets IMAGE_TAG on every deploy.

x-app: &app
  image: ghcr.io/ghyounesse/baskit:${IMAGE_TAG:-latest}
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # PHP-FPM. Also copies the public files to the shared volume for the web container.
  app:
    <<: *app
    environment:
      PUBLIC_SYNC_DIR: /public-shared
    volumes:
      - storage:/var/www/html/storage
      - public:/public-shared
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Nginx. Serves static files itself and forwards PHP to the app container.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
      - storage:/var/www/html/storage:ro
    mem_limit: 128m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Sends the queued e-mails (order confirmation, shipped, refunded).
  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600", "--max-jobs=1000"]
    volumes:
      - storage:/var/www/html/storage
    stop_grace_period: 30s
    mem_limit: 256m

  # Runs the daily jobs (carts:prune-guests, inventory:verify). No cron needed.
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage:/var/www/html/storage
    mem_limit: 192m

  # PostgreSQL. Not published to the host: only reachable from this compose network.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 768m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:    # the database
  storage:   # uploads (storage/app/public), logs, framework cache
  public:    # built assets, refreshed by the app container on every start
